<!doctype html>
<!--
  The link preview image, public/social.png (1200 x 630), drawn in the app's
  own fonts and month colours. It was rendered once with Playwright:

  node -e "import('@playwright/test').then(async ({ chromium }) => { const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1200, height: 630 } }); await p.goto('file://' + process.cwd() + '/scripts/social-image.html'); await p.evaluate(() => document.fonts.ready); await p.screenshot({ path: 'public/social.png' }); await b.close(); })"
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Solar calendar link preview</title>
<style>
  @font-face { font-family: 'Big Shoulders'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/big-shoulders/files/big-shoulders-latin-opsz-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Andika'; font-weight: 400; src: url('../node_modules/@fontsource/andika/files/andika-latin-400-normal.woff2') format('woff2'); }
  :root { --paper: #f6f7f9; --ink: #1d2742; --muted: #566079; --rule: #c9ceda; --l: 0.72; --c: 0.13; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--paper); color: var(--ink); font-family: 'Andika', sans-serif; padding: 64px; display: grid; grid-template-columns: 470px 1fr; grid-template-rows: auto 1fr; column-gap: 72px; }
  .strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(13, 1fr); gap: 8px; margin-bottom: 52px; }
  .strip span { height: 12px; background: oklch(var(--l) var(--c) var(--h)); }
  h1 { font-family: 'Big Shoulders', sans-serif; font-weight: 800; font-size: 132px; line-height: 0.86; letter-spacing: -0.01em; }
  p { font-size: 29px; line-height: 1.35; margin-top: 30px; text-wrap: pretty; }
  .url { font-size: 22px; color: var(--muted); margin-top: 34px; }
  .month { border-top: 8px solid oklch(var(--l) var(--c) 145); align-self: start; display: grid; grid-template-columns: repeat(7, 1fr); }
  .month b, .month span { border-bottom: 1px solid var(--rule); }
  .month b { font-weight: 400; color: var(--muted); font-size: 17px; padding: 10px 0 8px 10px; }
  .month span { font-family: 'Big Shoulders', sans-serif; font-weight: 300; font-size: 54px; line-height: 1; height: 86px; padding: 10px 0 0 10px; border-left: 1px solid var(--rule); }
  .month span:nth-of-type(7n + 1) { border-left: 0; }
</style>
</head>
<body>
  <div class="strip">
    <span style="--h: 145"></span><span style="--h: 117.3"></span><span style="--h: 89.6"></span><span style="--h: 61.9"></span><span style="--h: 34.2"></span><span style="--h: 6.5"></span><span style="--h: 338.8"></span><span style="--h: 311.2"></span><span style="--h: 283.5"></span><span style="--h: 255.8"></span><span style="--h: 228.1"></span><span style="--h: 200.4"></span><span style="--h: 172.7"></span>
  </div>
  <div>
    <h1>Solar calendar</h1>
    <p>13 months of 28 days. Every month starts on a Monday, and the year starts at the spring equinox.</p>
    <div class="url">solar.dealmobile.co.uk</div>
  </div>
  <div class="month">
    <b>Mon</b><b>Tue</b><b>Wed</b><b>Thu</b><b>Fri</b><b>Sat</b><b>Sun</b>
    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
    <span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
    <span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
    <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
  </div>
</body>
</html>
